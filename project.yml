name: WinTab
options:
  bundleIdPrefix: com.mn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Local self-signed identity (login keychain), no Apple Developer account. Stable cert keeps TCC grants across rebuilds.
    CODE_SIGN_IDENTITY: "Switch Local Signing"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "Switch Local Signing"
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
targets:
  WinTab:
    type: application
    platform: macOS
    sources:
      - path: Sources/Switch
      - path: Vendor/MediaRemoteAdapter
        type: folder
        buildPhase: resources
    dependencies:
      - framework: /System/Library/PrivateFrameworks/SkyLight.framework
        embed: false
    settings:
      base:
        PRODUCT_NAME: win-tab
        PRODUCT_MODULE_NAME: WinTab
        PRODUCT_BUNDLE_IDENTIFIER: com.mn.wintab
        INFOPLIST_FILE: Sources/Switch/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Sources/Switch/Resources/Switch.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Switch/Switch-Bridging-Header.h
        # Translation exists from macOS 15; the app still runs on 14 without the Translate tab.
        OTHER_LDFLAGS: "$(inherited) -weak_framework Translation"
      configs:
        Debug:
          # Library validation rejects the split debug dylib under a team-less self-signed identity.
          ENABLE_DEBUG_DYLIB: NO
